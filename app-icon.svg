<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2e"/>
      <stop offset="0.55" stop-color="#0d1421"/>
      <stop offset="1" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fddbf"/>
      <stop offset="1" stop-color="#25c2a0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#25c2a0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25c2a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#halo)"/>
  <rect x="38" y="38" width="948" height="948" rx="218" fill="none" stroke="#1e2d3d" stroke-width="12"/>

  <!-- waveform -->
  <g fill="url(#bar)" filter="url(#glow)">
    <rect x="196" y="432" width="56" height="160" rx="28"/>
    <rect x="292" y="372" width="56" height="280" rx="28"/>
    <rect x="388" y="302" width="56" height="420" rx="28"/>
    <rect x="484" y="232" width="56" height="560" rx="28"/>
    <rect x="580" y="302" width="56" height="420" rx="28"/>
    <rect x="676" y="372" width="56" height="280" rx="28"/>
    <rect x="772" y="432" width="56" height="160" rx="28"/>
  </g>
</svg>
