[package]
name = "rootvox"
version = "0.1.0"
description = "Local push-to-talk voice dictation (Wispr Flow clone, fully on-device)"
authors = ["educoben"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rootvox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent overlay window on macOS
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
hound = "3.5"
rubato = "0.16"
whisper-rs = { version = "0.14", features = ["metal"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
# enigo returns at phase 5 for Windows SendInput; its macOS permission
# preflight false-negatives for terminal-spawned dev builds, so Mac uses
# direct CGEvents (see inject.rs).

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Explicit mic TCC request: cpal's CoreAudio HAL capture gets silence without
# ever raising the permission prompt, so we must ask via AVCaptureDevice.
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

